[project]
name = "shifty-lsp"
version = "0.1.2"
description = "Language server for Turtle/RDF ontologies: ontoenv-powered owl:imports resolution and continuous SHACL validation via shifty"
requires-python = ">=3.11"
dependencies = [
    "pygls>=2.0",
    "ontoenv>=0.6,<0.7",
    "pyshifty>=0.3",
    "rdflib>=7.0",
]

[project.scripts]
shifty-lsp = "shifty_lsp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shifty_lsp"]
